<div class="field auth-phone-field" dir="rtl">
  <label for="{{ form.phone.id_for_label }}">{{ form.phone.label }}</label>
  {{ form.country_code }}
  {{ form.phone }}
  <small class="auth-phone-hint">اختر العلم لتغيير الدولة ورمز الاتصال، أو ابحث باسم الدولة.</small>
  {% for error in form.phone.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
  {% for error in form.country_code.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</div>
